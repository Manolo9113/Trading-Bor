version: "3.9"

services:
  trading-bot:
    build: .
    container_name: trading-bot
    restart: unless-stopped
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - EXCHANGE_API_KEY=${EXCHANGE_API_KEY}
      - EXCHANGE_SECRET=${EXCHANGE_SECRET}
    command: python main.py --mode live

  dashboard:
    build: .
    container_name: trading-dashboard
    restart: unless-stopped
    ports:
      - "8050:8050"
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - EXCHANGE_API_KEY=${EXCHANGE_API_KEY}
      - EXCHANGE_SECRET=${EXCHANGE_SECRET}
    command: python main.py --mode dashboard
    depends_on:
      - trading-bot
