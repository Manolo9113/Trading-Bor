name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: TA-Lib C-Bibliothek installieren
        run: |
          wget -q http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib && ./configure --prefix=/usr && make -j2 && sudo make install
          cd .. && rm -rf ta-lib ta-lib-0.4.0-src.tar.gz

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Tests ausfuehren
        run: pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

      - name: Coverage-Badge (optional)
        if: matrix.python-version == '3.11'
        run: echo "Coverage-Report oben sichtbar."

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint mit flake8
        run: |
          pip install flake8
          flake8 src/ tests/ --max-line-length=100 --ignore=E501,W503 --count
