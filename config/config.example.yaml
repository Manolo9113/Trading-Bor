# =============================================================
# Trading Bot – Konfigurationsdatei
# Kopiere diese Datei nach config/config.yaml und passe sie an.
# NIEMALS config/config.yaml in Git committen!
# =============================================================

exchange:
  name: "binance"
  api_key: ""
  secret: ""
  sandbox: true

trading:
  mode: "backtest"
  symbol: "BTC/USDT"
  timeframe: "1h"
  strategy: "fibonacci_confluence"

fibonacci:
  swing_window: 10
  use_wma: true
  wma_period: 14
  levels_retracement: [0.0, 0.236, 0.382, 0.5, 0.618, 0.786, 1.0]
  levels_extension: [1.272, 1.414, 1.618, 2.0, 2.618]
  confluence_tolerance: 0.003

patterns:
  enabled:
    - "engulfing"
    - "hammer"
    - "shooting_star"
    - "double_top"
    - "double_bottom"
    - "head_and_shoulders"
  swing_order: 5
  tolerance: 0.02

rsi_macd:
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14

risk:
  max_position_size: 0.1
  risk_per_trade: 0.02
  stop_loss_atr_mult: 2.0
  take_profit_ratio: 2.0
  max_open_positions: 3
  max_daily_drawdown: 0.05
  position_spacing: 0.005

backtest:
  start_date: "2023-01-01"
  end_date: "2024-12-31"
  initial_capital: 10000
  commission: 0.001
  slippage: 0.0005

optimize:
  param_grid:
    "fibonacci.confluence_tolerance": [0.002, 0.003, 0.005]
    "risk.stop_loss_atr_mult": [1.5, 2.0, 2.5]
    "risk.take_profit_ratio": [1.5, 2.0, 3.0]
  metric: "sharpe_ratio"
  walk_forward:
    enabled: false
    train_periods: 1000
    test_periods: 250

# ── MB-AktienScreener-API ────────────────────────────────────────────────────
# Railway-URL deines zweiten Services, z.B.:
#   https://mb-aktienscreener-api-production.up.railway.app
screener_api:
  base_url: ""                 # Pflicht fuer morning_scan-Modus
  api_key: ""                  # Optional: STOCKSMB_API_KEY
  timeout: 30

  # Watchlist-Filter fuer den Morgen-Scan
  daytrading:
    top_n: 15
    min_score: 55              # Nur Titel mit Score >= 55
    min_atr_pct: 2.0           # Mindest 2% taegliche Bewegung
    min_volume_m: 10.0         # Mindest 10M Shares/Tag
    exclude_leveraged_etfs: true   # TQQQ, SQQQ etc. ausschliessen

  # Makro-Filter: keinen Trade wenn Regime = Risk-Off
  macro_filter:
    enabled: true
    skip_on_risk_off: true     # Kein Kauf bei invertierter Zinskurve

# ── Morning-Scan-Zeitplan ────────────────────────────────────────────────────
morning_scan:
  run_time: "08:30"            # UTC – 30 Min vor US-Markteroeffnung (09:00 ET)
  notify_telegram: true
  save_to_file: true           # Watchlist als CSV in data/ speichern
  file_path: "data/watchlist_{date}.csv"

telegram:
  bot_token: ""
  chat_id: ""

dashboard:
  enabled: true
  host: "0.0.0.0"
  port: 8050
  debug: false

logging:
  level: "INFO"
  file: "logs/trading_bot.log"
  max_bytes: 10485760
  backup_count: 5
