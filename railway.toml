[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Standardmaessig Alpaca Paper-Trading.
# In Railway: Service > Variables > BOT_MODE setzen (z.B. alpaca_live)
startCommand = "python main.py --mode ${BOT_MODE:-alpaca_paper}"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
